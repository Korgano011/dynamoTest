<body bgcolor="#dfe6e9">

<h2>Practice Dynamo Database Insert</h2>

<label>Name</label>
<br>
<input type="text" id="name">
<br>

<label>Description</label>
<br>
<input type="text" id="desc">
<br>

<button onclick="saveRecord()">Submit</button>

<div id="result"></div>

<script>

const API_URL =
"https://7f6zejkel6.execute-api.us-east-1.amazonaws.com/default/lambdaTest";

async function saveRecord(){

    const name = document.getElementById("name").value.trim();
    const desc = document.getElementById("desc").value.trim();
    const resultDiv = document.getElementById("result");

    // Make sure both fields contain data
    if (!name || !desc) {
        resultDiv.innerHTML = "Please enter both a name and description.";
        return;
    }

    try {

        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                desc: desc
            })
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Unable to save record");
        }

        resultDiv.innerHTML = "Status: " + result.Status;

        // Clear the fields if the save was successful
        document.getElementById("name").value = "";
        document.getElementById("desc").value = "";

        document.getElementById("name").focus();

    } catch (error) {

        console.error(error);
        resultDiv.innerHTML = "Error: " + error.message;
    }
}

</script>
